<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Currency Converter</title>
  <style>
    body { font-family: sans-serif; background: #f2f4f8; display: flex;
           justify-content: center; padding-top: 60px; }
    .card { background: white; padding: 30px; border-radius: 12px;
            box-shadow: 0 4px 12px rgba(0,0,0,.1); width: 340px; }
    input, select, button { width: 100%; padding: 10px; margin: 6px 0 14px;
                            font-size: 16px; box-sizing: border-box; }
    button { background: #2563eb; color: white; border: none;
             border-radius: 6px; cursor: pointer; }
    .result { font-size: 20px; font-weight: bold; color: #166534; }
    .error { color: #b91c1c; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Currency Converter</h2>
    <form method="POST">
      <label>Amount</label>
      <input type="number" step="any" name="amount" value="{{ form.amount }}" required>

      <label>From</label>
      <select name="from_cur">
        {% for code, name in currencies.items() %}
          <option value="{{ code }}" {% if code == form.from_cur %}selected{% endif %}>
            {{ code }} - {{ name }}
          </option>
        {% endfor %}
      </select>

      <label>To</label>
      <select name="to_cur">
        {% for code, name in currencies.items() %}
          <option value="{{ code }}" {% if code == form.to_cur %}selected{% endif %}>
            {{ code }} - {{ name }}
          </option>
        {% endfor %}
      </select>

      <button type="submit">Convert</button>
    </form>

    {% if result %}<p class="result">{{ result }}</p>{% endif %}
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
  </div>
</body>
</html>
